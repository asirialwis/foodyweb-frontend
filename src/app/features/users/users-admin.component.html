<section class="space-y-2 mb-8 py-4">
  <h1>User administration</h1>
  <p>Manage account roles and basic profile details.</p>
</section>

<section class="space-y-4">
  @for (user of users(); track user.id ?? user.email) {
    <article class="bg-white rounded-lg border border-gray-200 p-6 mb-4">
      <header>
        <strong>{{ user.firstName }} {{ user.lastName }}</strong>
        <span>{{ user.role }}</span>
      </header>

      <p>{{ user.email }}</p>

      <form [formGroup]="editForms[user.id || '']" (ngSubmit)="update(user)">
        <input formControlName="firstName" placeholder="First name" />
        <input formControlName="lastName" placeholder="Last name" />
        <input formControlName="phone" placeholder="Phone" />
        <select formControlName="role">
          <option value="customer">customer</option>
          <option value="restaurant_owner">restaurant owner</option>
          <option value="delivery_driver">delivery driver</option>
          <option value="admin">admin</option>
        </select>

        <button type="submit">Save</button>
        <button type="button" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded" (click)="remove(user)">Delete</button>
      </form>
    </article>
  }
</section>
