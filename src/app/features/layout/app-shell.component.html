<div class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-20 flex items-center justify-between gap-4 px-6 py-3 bg-gray-900 text-white shadow-lg">
    <div class="text-2xl font-bold cursor-pointer hover:text-primary-400 transition-colors" routerLink="/dashboard">FoodyWeb</div>

    <nav class="flex items-center gap-x-2">
      @for (item of navItems(); track item.link) {
        <a 
          [routerLink]="item.link" 
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          [class.bg-primary-600]="rla.isActive"
          [class.text-white]="rla.isActive"
          [class.text-gray-300]="!rla.isActive"
          [class.hover:bg-gray-800]="!rla.isActive"
          [class.hover:text-white]="!rla.isActive"
          class="px-4 py-2 rounded-lg transition-all"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-4">
      <span class="text-sm text-gray-300">Hi, <span class="font-semibold">{{ firstName() }}</span></span>
      <button 
        type="button" 
        (click)="logout()"
        class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-medium text-sm"
      >
        Logout
      </button>
    </div>
  </header>

  <main class="flex-1 p-4 md:p-6">
    <router-outlet />
  </main>
</div>
